name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  # A release published on GitHub (with a new tag) gets the bundle attached.
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: leva2mqtt-customcard
          path: dist/leva2mqtt-customcard.js
      # A pushed tag creates the release, a published release is completed; either way the
      # bundle is attached. HACS installs from the latest release.
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/leva2mqtt-customcard.js
          generate_release_notes: ${{ github.event_name == 'push' }}
